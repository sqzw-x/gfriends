name: Sync upstream

# 让 sqzw-x/gfriends:master 跟上 gfriends/gfriends:master(上游每天自动更新)
on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: '只校验输入与配置, 不做实际同步'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Sync master from gfriends/gfriends
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # 仓库 6 GiB / 7 万文件: 只取单条历史、且不物化工作区, 否则每跑一次都要拉全部文件
      - name: Checkout fork
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: .github
          persist-credentials: false

      - name: Sync upstream
        id: sync
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.3
        with:
          upstream_sync_repo: gfriends/gfriends
          upstream_sync_branch: master
          target_sync_branch: master
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          shallow_since: '1 month ago'
          test_mode: ${{ inputs.test_mode || false }}

      # 上游取不到时该 action 也只输出 "No new commits" 并以 0 退出, 这里单独核对
      - name: Verify fork caught up
        if: ${{ !inputs.test_mode }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_STARTED_AT: ${{ github.run_started_at }}
        run: |
          set -euo pipefail
          behind=$(gh api "repos/gfriends/gfriends/compare/master...sqzw-x:master" --jq '.behind_by')
          upstream_date=$(gh api "repos/gfriends/gfriends/commits/master" --jq '.commit.committer.date')
          echo "has_new_commits=${{ steps.sync.outputs.has_new_commits }} behind_by=$behind upstream_head=$upstream_date run_started_at=$RUN_STARTED_AT"
          if [ "$behind" -gt 0 ] && [[ "$upstream_date" < "$RUN_STARTED_AT" ]]; then
            echo "::error::fork 仍落后上游 $behind 个提交, 本次没有同步成功"
            exit 1
          fi
